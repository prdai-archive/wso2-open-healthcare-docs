name: WSO2 Open Healthcare Docs Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-wso2-open-healthcare-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # Full history so showLastUpdateTime can read per-file git dates.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: en/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: en

      - name: Build Docusaurus site
        run: npm run build
        working-directory: en
        env:
          # The site is served from the root of https://healthcare.docs.wso2.com,
          # not from a /open-healthcare-docs/ sub-path.
          BASE_URL: /

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: en/build
          cname: healthcare.docs.wso2.com
