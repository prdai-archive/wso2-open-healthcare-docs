name: Cut docs version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to freeze, no leading v (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: en/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: en

      - name: Freeze docs version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          npx docusaurus docs:version "$VERSION"
          rm -rf "versioned_docs/version-$VERSION/old-content"
        working-directory: en

      - name: Build Docusaurus site
        run: npm run build
        working-directory: en
        env:
          BASE_URL: /

      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch="docs/version-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add en/versions.json en/versioned_docs en/versioned_sidebars
          git commit -m "docs: freeze version $VERSION"
          git push origin "$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "docs: freeze version $VERSION" \
            --body "Freezes the current \`en/docs\` tree as version \`$VERSION\`. The latest release is served at \`/docs\`; main remains at \`/docs/next\`. Verified with \`npm run build\`."
